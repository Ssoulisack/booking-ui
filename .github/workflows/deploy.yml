# Copy to the FRONTEND repo as .github/workflows/deploy.yml, together with ci/frontend/Dockerfile and Caddyfile
# (both at the repo root). Same flow as the API:
#
#   push to branch `test`  → type check, lint, unit tests, build → image booking-web:sha-<commit> → TEST
#   push of a tag v1.2.0   → (on main) the image of that commit is promoted to 1.2.0 if it passed on test → PRODUCTION (approval)
#   push to `main`         → nothing deploys
#
# The site is built with VITE_API_URL=/api/v1 (same domain as the API), so ONE image works in every environment.
# GitHub settings: the same environments, secrets and variables as the backend workflow, with WEB_IMAGE (variable,
# e.g. user/booking-web) instead of API_IMAGE.
name: web

on:
  push:
    branches: [test]
    tags: ["v*"]

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ${{ vars.WEB_IMAGE }}

jobs:
  image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tags.outputs.deploy_tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: A release tag must be on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::tag $GITHUB_REF_NAME is not on main"; exit 1; }
      - id: tags
        run: |
          short="sha-${GITHUB_SHA::7}"
          echo "short=$short" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "deploy_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else echo "deploy_tag=$short" >> "$GITHUB_OUTPUT"; fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: promote
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.tags.outputs.short }}" >/dev/null 2>&1; then
            docker buildx imagetools create -t "$IMAGE:${{ steps.tags.outputs.deploy_tag }}" "$IMAGE:${{ steps.tags.outputs.short }}"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.promote.outputs.done != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.promote.outputs.done != 'true'
        run: npm ci
      - if: steps.promote.outputs.done != 'true'
        run: npm run lint --if-present
      - if: steps.promote.outputs.done != 'true'
        run: npm test -- --passWithNoTests # the tests live in test/ which is git-ignored (local only), so CI may have none
      - if: steps.promote.outputs.done != 'true'
        run: npm run build # tsc -b && vite build → dist
        env:
          VITE_API_URL: /api/v1
      - if: steps.promote.outputs.done != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tags.outputs.short }}
            ${{ env.IMAGE }}:${{ steps.tags.outputs.deploy_tag }}

  deploy-test:
    if: github.ref == 'refs/heads/test'
    needs: image
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          install -m 600 /dev/null known_hosts && printf '%s\n' "$SSH_KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && ./scripts/deploy.sh web '$TAG'"

  deploy-production:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: image
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          TAG: ${{ needs.image.outputs.tag }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          install -m 600 /dev/null known_hosts && printf '%s\n' "$SSH_KNOWN_HOSTS" > known_hosts
          ssh -i key -o UserKnownHostsFile=known_hosts -o StrictHostKeyChecking=yes "$SSH_USER@$SSH_HOST" \
            "cd '$DEPLOY_PATH' && ./scripts/deploy.sh web '$TAG'"
